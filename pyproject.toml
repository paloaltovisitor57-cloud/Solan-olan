[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-sniper"
version = "0.1.0"
description = "Live Solana new-token discovery, scoring, sizing and manual-confirm execution engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx[http2]>=0.27",
  "websockets>=12",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "structlog>=24",
  "rich>=13.7",
  "typer>=0.12",
  "pyyaml>=6",
]

[project.optional-dependencies]
# read-only web dashboard (`solana-sniper dashboard-web`); pandas is a Streamlit dependency
# that the pages use directly for tables
web = [
  "streamlit>=1.45,<2",
  "plotly>=5.24",
  "pandas>=2.2",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "mypy>=1.10",
  "ruff>=0.5",
  "types-PyYAML",
  "pandas-stubs",
  "streamlit>=1.45,<2",
  "plotly>=5.24",
  "pandas>=2.2",
]

[project.scripts]
solana-sniper = "solana_sniper.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solana_sniper = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF", "SIM", "N", "T20"]
ignore = ["RUF012", "SIM108", "B008", "T201", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
# presentation-heavy modules: long formatted strings are clearer unbroken
"src/solana_sniper/cli/dashboard.py" = ["E501"]
"src/solana_sniper/cli/main.py" = ["E501"]
"src/solana_sniper/cli/commands.py" = ["E501"]
"src/solana_sniper/app/doctor.py" = ["E501"]
"src/solana_sniper/web/app.py" = ["E501"]
# embeds shell scripts for the mocked-launchd deployment test
"tests/integration/test_scripts.py" = ["E501"]
# fixture builder for the web dashboard tests: long literal rows are clearer unbroken
"tests/web/seed.py" = ["E501"]
# real-clock end-to-end run against mocked live providers: polling with sleep is intended
"tests/integration/test_live_pipeline_mocked.py" = ["E501", "ASYNC110"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["solana_sniper"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = true

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
markers = ["timeout: per-test timeout in seconds (pytest-timeout)"]
